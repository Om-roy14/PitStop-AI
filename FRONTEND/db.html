<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop AI - Portfolio Manager</title>
  <link rel="stylesheet" href="/static/db.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="min-h-screen antialiased">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-semibold border border-white/40 backdrop-blur-xl"></div>

  <!-- Header / Navigation -->
  <header class="ios-glass-nav sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold tracking-tight text-white">PitStop AI — Portfolio Manager</h1>
      </div>
      <div>
        <a href="/dashboard" class="text-sm text-white underline mr-4">Dashboard</a>
        <button onclick="openAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-bold">Add Project</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    <div class="ios-glass-card rounded-[32px] overflow-hidden bg-slate-900/40 p-6 border border-white/10">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-white">Projects (<span id="projectCount">0</span>)</h2>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-200">
          <thead class="uppercase text-xs font-bold text-slate-400 border-b border-white/10">
            <tr>
              <th class="px-6 py-4">ID</th>
              <th class="px-6 py-4">Project Name</th>
              <th class="px-6 py-4">Tech Stack</th>
              <th class="px-6 py-4">Repository</th>
              <th class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="portfolioTableBody" class="divide-y divide-white/10"></tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <p class="text-white font-bold">No projects found</p>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-12">
        <div class="inline-block animate-spin h-8 w-8 border-4 border-white border-t-transparent rounded-full"></div>
        <p class="text-white text-xs mt-2">Loading projects...</p>
      </div>
    </div>
  </main>

  <!-- ADD MODAL -->
  <div id="addModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/20 rounded-3xl w-full max-w-md p-6 text-white">
      <h3 class="text-lg font-bold mb-4">Add New Project</h3>
      <form id="addForm" onsubmit="submitAddProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase text-slate-400 mb-1">Project Name</label>
          <input type="text" id="add_name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs uppercase text-slate-400 mb-1">Tech Stack (comma separated)</label>
          <input type="text" id="add_stack" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
        </div>
        <div>
          <label class="block text-xs uppercase text-slate-400 mb-1">GitHub Repo URL</label>
          <input type="url" id="add_repo" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-700 rounded-xl text-sm">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-bold">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/FRONTEND/auth.js"></script>
  <script>
    Auth.protectPage();
    let allProjects = [];

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if(!toast) return;
      const isSuccess = type === 'success';
      toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-100 translate-y-0 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium ${
        isSuccess ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
      }`;
      toast.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
      setTimeout(() => toast.className = toast.className.replace('opacity-100 translate-y-0', 'opacity-0 translate-y-[-20px] pointer-events-none'), 3500);
    }

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

    async function loadProjects() {
      const loadingState = document.getElementById('loadingState');
      const emptyState = document.getElementById('emptyState');
      if(loadingState) loadingState.classList.remove('hidden');
      if(emptyState) emptyState.classList.add('hidden');

      try {
        const response = await Auth.fetch('/api/portfolio');
        if (!response.ok) throw new Error('Failed to fetch portfolios');
        
        allProjects = await response.json();
        renderTable(allProjects);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        if(loadingState) loadingState.classList.add('hidden');
      }
    }

    function renderTable(projects) {
      const tableBody = document.getElementById('portfolioTableBody');
      const countEl = document.getElementById('projectCount');
      if(countEl) countEl.textContent = projects.length;
      if(!tableBody) return;
      tableBody.innerHTML = '';

      if (projects.length === 0) {
        document.getElementById('emptyState')?.classList.remove('hidden');
        return;
      }

      projects.forEach(p => {
        const tags = (p.tech_stack || '').split(',').map(tag => 
          `<span class="inline-block bg-slate-700/65 border border-slate-600 text-indigo-300 text-xs px-2 py-0.5 rounded-md mr-1 mb-1 font-mono">${tag.trim()}</span>`
        ).join('');

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="px-6 py-4 font-mono font-medium text-slate-300">#${p.id}</td>
          <td class="px-6 py-4 font-semibold text-white">${p.project_name}</td>
          <td class="px-6 py-4 max-w-xs">${tags}</td>
          <td class="px-6 py-4">
            <a href="${p.github_repo}" target="_blank" class="text-[#97CADB] hover:text-white hover:underline">View Repo</a>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button onclick="deleteProject(${p.id})" class="p-2 text-slate-300 hover:text-rose-300 transition" title="Delete">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    async function submitAddProject(e) {
      e.preventDefault();
      const payload = {
        project_name: document.getElementById('add_name').value.trim(),
        tech_stack: document.getElementById('add_stack').value.trim(),
        github_repo: document.getElementById('add_repo').value.trim()
      };

      try {
        const response = await Auth.fetch('/api/portfolio', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error('Could not add portfolio');
        
        showToast('Project added successfully!');
        closeAddModal();
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteProject(id) {
      if (!confirm(`Delete project #${id}?`)) return;
      try {
        const response = await Auth.fetch(`/api/portfolio/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Could not delete portfolio');
        
        showToast(`Project deleted.`);
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadProjects);
  </script>
</body>
</html>
