<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop AI - Portfolio Manager</title>
  <link rel="stylesheet" href="/static/db.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Heroicons / FontAwesome CDN for UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    
  </style>
</head>
<body class="min-h-screen antialiased">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-semibold border border-white/40 backdrop-blur-xl"></div>

  <!-- Header / Navigation -->
  <header class="ios-glass-nav sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-2xl ios-glass-pill flex items-center justify-center font-bold text-white shadow-md">
          <i class="fa-solid fa-code text-sm"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white drop-shadow-sm">PitStop AI</h1>
          <p class="text-xs text-[#D6E8EE]/80 font-medium">Portfolio Management Workspace</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <button onclick="openAddModal()" class="ios-btn-primary w-full sm:w-auto inline-flex items-center justify-center gap-2 text-sm font-bold px-6 py-2.5 rounded-full">
          <i class="fa-solid fa-plus text-xs"></i> Add Project
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- Controls Bar (Search & Counter) -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-[#D6E8EE]/70 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()" 
          placeholder="Search by project name or tech stack..." 
          class="ios-glass-pill w-full pl-11 pr-4 py-2.5 rounded-full text-sm placeholder-[#D6E8EE]/60"
        />
      </div>
      <div class="text-sm text-[#D6E8EE]/90 font-medium self-center sm:self-auto drop-shadow-sm">
        Showing <span id="projectCount" class="font-bold text-white">0</span> projects
      </div>
    </div>

    <!-- Portfolio Table Container -->
    <div class="ios-glass-card rounded-[32px] overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-[#D6E8EE]">
          <thead class="ios-table-header text-xs uppercase font-bold text-[#D6E8EE]/90 tracking-wider">
            <tr>
              <th scope="col" class="px-6 py-4">ID</th>
              <th scope="col" class="px-6 py-4">Project Name</th>
              <th scope="col" class="px-6 py-4">Tech Stack</th>
              <th scope="col" class="px-6 py-4">Repository</th>
              <th scope="col" class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="portfolioTableBody" class="divide-y divide-white/10">
            <!-- Dynamic rows will be inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16 px-4">
        <div class="h-14 w-14 rounded-2xl ios-glass-pill flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-folder-open text-2xl text-[#D6E8EE]"></i>
        </div>
        <p class="text-white font-bold text-lg">No projects found</p>
        <p class="text-[#D6E8EE]/75 text-xs mt-1">Get started by creating a new portfolio entry above.</p>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-16 px-4">
        <div class="inline-block animate-spin h-8 w-8 border-4 border-[#D6E8EE] border-t-transparent rounded-full"></div>
        <p class="text-[#D6E8EE] text-xs font-semibold mt-3">Loading projects...</p>
      </div>
    </div>
  </main>

  <!-- ================= ADD MODAL ================= -->
  <div id="addModal" class="fixed inset-0 bg-[#001B48]/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="ios-glass-card rounded-[32px] w-full max-w-md p-6 animate-fade-in text-white">
      <div class="flex items-center justify-between border-b border-white/20 pb-3 mb-5">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl ios-glass-pill flex items-center justify-center">
            <i class="fa-solid fa-folder-plus text-sm"></i>
          </div>
          Add New Project
        </h3>
        <button onclick="closeAddModal()" class="text-[#D6E8EE]/70 hover:text-white p-1 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="addForm" onsubmit="submitAddProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">Project ID</label>
          <input type="number" id="add_id" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm placeholder-[#D6E8EE]/50" placeholder="e.g. 101" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">Project Name</label>
          <input type="text" id="add_name" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm placeholder-[#D6E8EE]/50" placeholder="e.g. Stock Analysis Agent" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">Tech Stack (comma separated)</label>
          <input type="text" id="add_stack" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm placeholder-[#D6E8EE]/50" placeholder="e.g. FastAPI, MySQL, SQLAlchemy" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">GitHub Repository URL</label>
          <input type="url" id="add_repo" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm placeholder-[#D6E8EE]/50" placeholder="https://github.com/user/project" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/20">
          <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 rounded-full ios-glass-pill text-[#D6E8EE] text-sm font-semibold">Cancel</button>
          <button type="submit" class="ios-btn-primary px-6 py-2.5 rounded-full text-sm font-bold">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div id="editModal" class="fixed inset-0 bg-[#001B48]/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="ios-glass-card rounded-[32px] w-full max-w-md p-6 text-white">
      <div class="flex items-center justify-between border-b border-white/20 pb-3 mb-5">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl ios-glass-pill flex items-center justify-center">
            <i class="fa-solid fa-pen-to-square text-sm"></i>
          </div>
          Edit Project
        </h3>
        <button onclick="closeEditModal()" class="text-[#D6E8EE]/70 hover:text-white p-1 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="editForm" onsubmit="submitEditProject(event)" class="space-y-4">
        <input type="hidden" id="edit_id" />
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">Project Name</label>
          <input type="text" id="edit_name" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">Tech Stack</label>
          <input type="text" id="edit_stack" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#D6E8EE]/80 mb-1.5">GitHub Repo</label>
          <input type="url" id="edit_repo" required class="ios-glass-pill w-full rounded-2xl px-4 py-2.5 text-sm" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/20">
          <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 rounded-full ios-glass-pill text-[#D6E8EE] text-sm font-semibold">Cancel</button>
          <button type="submit" class="ios-btn-primary px-6 py-2.5 rounded-full text-sm font-bold">Update Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Operations (Exact same unchanged API logic) -->
  <script>
    let allProjects = [];

    // --- Toast Notifications ---
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const isSuccess = type === 'success';
      
      toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-100 translate-y-0 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium ${
        isSuccess ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
      }`;
      toast.innerHTML = `
        <i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
        <span>${message}</span>
      `;
      
      setTimeout(() => {
        toast.className = toast.className.replace('opacity-100 translate-y-0', 'opacity-0 translate-y-[-20px] pointer-events-none');
      }, 3500);
    }

    // --- 1. READ (Fetch All Projects) ---
    async function loadProjects() {
      const tableBody = document.getElementById('portfolioTableBody');
      const loadingState = document.getElementById('loadingState');
      const emptyState = document.getElementById('emptyState');
      
      loadingState.classList.remove('hidden');
      emptyState.classList.add('hidden');

      try {
        const response = await fetch('/portfolio');
        if (!response.ok) throw new Error('Failed to fetch portfolios');
        
        allProjects = await response.json();
        renderTable(allProjects);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    function renderTable(projects) {
      const tableBody = document.getElementById('portfolioTableBody');
      const emptyState = document.getElementById('emptyState');
      const projectCount = document.getElementById('projectCount');
      
      tableBody.innerHTML = '';
      projectCount.textContent = projects.length;

      if (projects.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      projects.forEach(p => {
        // Render tech tags
        const tags = p.teck_stack.split(',').map(tag => 
          `<span class="inline-block bg-slate-700/60 border border-slate-600 text-indigo-300 text-xs px-2 py-0.5 rounded-md mr-1 mb-1 font-mono">${tag.trim()}</span>`
        ).join('');

        const row = document.createElement('tr');
        row.className = "ios-table-row transition-colors";
        row.innerHTML = `
          <td class="px-6 py-4 font-mono font-medium text-slate-300">#${p.Project_id}</td>
          <td class="px-6 py-4 font-semibold text-white">${p.Project_name}</td>
          <td class="px-6 py-4 max-w-xs">${tags}</td>
          <td class="px-6 py-4">
            <a href="${p.github_repo}" target="_blank" class="inline-flex items-center gap-1.5 text-[#97CADB] hover:text-white hover:underline">
              <i class="fa-brands fa-github"></i>
              <span class="truncate max-w-[180px]">${p.github_repo.replace('https://github.com/', '')}</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button onclick="openEditModal(${p.Project_id}, '${escapeHtml(p.Project_name)}', '${escapeHtml(p.teck_stack)}', '${escapeHtml(p.github_repo)}')" class="p-2 text-slate-300 hover:text-amber-300 hover:bg-white/10 rounded-lg transition" title="Edit">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteProject(${p.Project_id})" class="p-2 text-slate-300 hover:text-rose-300 hover:bg-white/10 rounded-lg transition" title="Delete">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // --- 2. CREATE (Add Project) ---
    function openAddModal() {
      document.getElementById('addForm').reset();
      document.getElementById('addModal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    async function submitAddProject(e) {
      e.preventDefault();
      const payload = {
        Project_id: parseInt(document.getElementById('add_id').value),
        Project_name: document.getElementById('add_name').value.trim(),
        teck_stack: document.getElementById('add_stack').value.trim(),
        github_repo: document.getElementById('add_repo').value.trim()
      };

      try {
        const response = await fetch('/portfolio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not add portfolio');
        }

        showToast('Project added successfully!');
        closeAddModal();
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- 3. UPDATE (Edit Project) ---
    function openEditModal(id, name, stack, repo) {
      document.getElementById('edit_id').value = id;
      document.getElementById('edit_name').value = name;
      document.getElementById('edit_stack').value = stack;
      document.getElementById('edit_repo').value = repo;
      document.getElementById('editModal').classList.remove('hidden');
    }
    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function submitEditProject(e) {
      e.preventDefault();
      const id = document.getElementById('edit_id').value;
      const payload = {
        Project_name: document.getElementById('edit_name').value.trim(),
        teck_stack: document.getElementById('edit_stack').value.trim(),
        github_repo: document.getElementById('edit_repo').value.trim()
      };

      try {
        const response = await fetch(`/portfolio/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not update portfolio');
        }

        showToast('Project updated successfully!');
        closeEditModal();
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- 4. DELETE (Remove Project) ---
    async function deleteProject(id) {
      if (!confirm(`Are you sure you want to delete Project #${id}?`)) return;

      try {
        const response = await fetch(`/portfolio/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not delete portfolio');
        }

        showToast(`Project #${id} deleted.`);
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- Helpers ---
    function handleSearch() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProjects.filter(p => 
        p.Project_name.toLowerCase().includes(term) || 
        p.teck_stack.toLowerCase().includes(term)
      );
      renderTable(filtered);
    }

    function escapeHtml(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', loadProjects);
  </script>
</body>
</html>
