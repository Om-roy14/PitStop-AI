<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="shortcut icon" href="/static/logo1.png" type="image/x-icon">

  <link rel="stylesheet" href="/static/signup.css">
  <title>PitStop AI — Register</title>
</head>
<body>

  <main class="ios-glass-card" id="registerCard">
    <div class="header">
      <h1>PitStop AI</h1>
      <p class="subtitle">Create your account</p>
    </div>

    <form id="registerForm">
      <div class="input-wrapper">
        <input type="text" id="registerName" placeholder="Full Name" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="email" id="registerEmail" placeholder="Email Address" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="password" id="registerPassword" placeholder="Password (Min. 8 characters)" required minlength="8" />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <p id="registerMessage" class="message-box"></p>

    <div class="footer-dock">
      <span>Already have an account?</span>
      <a href="/login" class="dock-link">Login</a>
    </div>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msgBox = document.getElementById('registerMessage');
      msgBox.style.color = '#97CADB';
      msgBox.textContent = 'Creating account...';

      const payload = {
        name: document.getElementById('registerName').value.trim(),
        email: document.getElementById('registerEmail').value.trim(),
        password: document.getElementById('registerPassword').value
      };

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || data.message || 'Registration failed');

        msgBox.style.color = '#D6E8EE';
        msgBox.textContent = 'Account created successfully! Redirecting to login...';
        document.getElementById('registerForm').reset();

        setTimeout(() => {
          window.location.href = '/login'; 
        }, 1200);
      } catch (error) {
        msgBox.style.color = '#FFA8A8';
        msgBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
