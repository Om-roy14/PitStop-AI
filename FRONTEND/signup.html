<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/signup.css">
  <title>PitStop AI — Register</title>
  <style>
    
  </style>
</head>
<body>

  <!-- ================= 1. REGISTER CARD ================= -->
  <main class="ios-glass-card" id="registerCard">
    <div class="header">
      <h1>PitStop AI</h1>
      <p class="subtitle">Create your account</p>
    </div>

    <form id="registerForm">
      <div class="input-wrapper">
        <input type="text" id="registerName" placeholder="Full Name" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="email" id="registerEmail" placeholder="Email Address" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="password" id="registerPassword" placeholder="Password (Min. 8 characters)" required minlength="8" />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="url" id="registerLinkedin" placeholder="LinkedIn Profile URL" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="url" id="registerGithub" placeholder="GitHub Profile URL" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <p id="registerMessage" class="message-box"></p>

    <div class="footer-dock">
      <span>Already have an account?</span>
      <!-- Directing to the login page -->
      <a href="/login" class="dock-link">Login</a>
    </div>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const msgBox = document.getElementById('registerMessage');
      msgBox.style.color = '#97CADB';
      msgBox.textContent = 'Creating account...';

      const payload = {
        name: document.getElementById('registerName').value.trim(),
        email: document.getElementById('registerEmail').value.trim(),
        password: document.getElementById('registerPassword').value,
        linkedin: document.getElementById('registerLinkedin').value.trim(),
        github: document.getElementById('registerGithub').value.trim()
      };

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || data.message || 'Registration failed');

        msgBox.style.color = '#D6E8EE';
        msgBox.textContent = 'Account created successfully! Redirecting to login...';
        document.getElementById('registerForm').reset();

        // Redirecting to the separated login page after successful registration
        setTimeout(() => {
          window.location.href = '/login'; 
        }, 1200);
      } catch (error) {
        msgBox.style.color = '#FFA8A8';
        msgBox.textContent = error.message;
      }
    });
  </script>
  <script src="/static/script.js"></script>
</body>
</html>
