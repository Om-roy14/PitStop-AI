<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="shortcut icon" href="/static/logo1.png" type="image/x-icon">

  <link rel="stylesheet" href="/static/login.css">
  <title>PitStop AI — Login</title>
</head>
<body>

  <main class="ios-glass-card" id="loginCard">
    <div class="header">
      <h1>PitStop AI</h1>
      <p class="subtitle">AI-powered cold email automation</p>
    </div>

    <form id="loginForm">
      <div class="input-wrapper">
        <input type="email" id="email" placeholder="Email Address" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>

      <div class="input-wrapper">
        <input type="password" id="password" placeholder="Password" required />
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <p id="loginMessage" class="message-box"></p>

    <div class="footer-dock">
      <span>Don't have an account?</span>
      <a href="/signup" class="dock-link">Register</a>
    </div>
  </main>

  <script src="/FRONTEND/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const msgBox = document.getElementById("loginMessage");
        msgBox.textContent = "Logging in...";

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Login failed");
            }

            // Save JWT using our centralized Auth module
            Auth.setToken(data.access_token);
            window.location.replace("/dashboard");

        } catch (error) {
            console.error("Login error:", error);
            msgBox.textContent = error.message;
            msgBox.style.color = '#FFA8A8';
        }
    });
  </script>
</body>
</html>
