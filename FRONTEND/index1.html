<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop AI - Portfolio Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Heroicons / FontAwesome CDN for UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm"></div>

  <!-- Header / Navigation -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-10 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-inner">
          <i class="fa-solid fa-code"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">PitStop AI</h1>
          <p class="text-xs text-slate-400">Portfolio Management Dashboard</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
        <button onclick="openAddModal()" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition shadow-md shadow-indigo-600/20 active:scale-95">
          <i class="fa-solid fa-plus text-xs"></i> Add Project
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Controls Bar (Search & Counter) -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
      <div class="relative flex-1 max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()" 
          placeholder="Search by project name or tech stack..." 
          class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
        />
      </div>
      <div class="text-sm text-slate-400 self-center sm:self-auto">
        Showing <span id="projectCount" class="font-semibold text-slate-200">0</span> projects
      </div>
    </div>

    <!-- Portfolio Table Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/60 border-b border-slate-700 text-xs uppercase font-semibold text-slate-400 tracking-wider">
            <tr>
              <th scope="col" class="px-6 py-4">ID</th>
              <th scope="col" class="px-6 py-4">Project Name</th>
              <th scope="col" class="px-6 py-4">Tech Stack</th>
              <th scope="col" class="px-6 py-4">Repository</th>
              <th scope="col" class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="portfolioTableBody" class="divide-y divide-slate-700/60">
            <!-- Dynamic rows will be inserted here -->
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12 px-4">
        <div class="h-12 w-12 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-folder-open text-xl"></i>
        </div>
        <p class="text-slate-300 font-medium text-base">No projects found</p>
        <p class="text-slate-500 text-xs mt-1">Get started by creating a new portfolio entry above.</p>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center py-12 px-4">
        <div class="inline-block animate-spin h-8 w-8 border-4 border-indigo-500 border-t-transparent rounded-full"></div>
        <p class="text-slate-400 text-xs mt-3">Loading projects...</p>
      </div>
    </div>
  </main>

  <!-- ================= ADD MODAL ================= -->
  <div id="addModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl animate-fade-in">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-5">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-indigo-400"></i> Add New Project
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="addForm" onsubmit="submitAddProject(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Project ID</label>
          <input type="number" id="add_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="e.g. 101" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Project Name</label>
          <input type="text" id="add_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="e.g. PitStop Cold Mailer" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tech Stack (comma separated)</label>
          <input type="text" id="add_stack" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="e.g. FastAPI, MySQL, SQLAlchemy" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub Repository URL</label>
          <input type="url" id="add_repo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="https://github.com/user/project" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-3">
          <button type="button" onclick="closeAddModal()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium transition">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition shadow-md shadow-indigo-600/30">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= EDIT MODAL ================= -->
  <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-5">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-400"></i> Edit Project
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editForm" onsubmit="submitEditProject(event)" class="space-y-4">
        <input type="hidden" id="edit_id" />
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Project Name</label>
          <input type="text" id="edit_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tech Stack</label>
          <input type="text" id="edit_stack" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub Repo</label>
          <input type="url" id="edit_repo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="flex items-center justify-end gap-3 pt-3">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium transition">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-medium transition shadow-md shadow-amber-600/30">Update Project</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Operations -->
  <script>
    let allProjects = [];

    // --- Toast Notifications ---
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const isSuccess = type === 'success';
      
      toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-100 translate-y-0 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium ${
        isSuccess ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
      }`;
      toast.innerHTML = `
        <i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
        <span>${message}</span>
      `;
      
      setTimeout(() => {
        toast.className = toast.className.replace('opacity-100 translate-y-0', 'opacity-0 translate-y-[-20px] pointer-events-none');
      }, 3500);
    }

    // --- 1. READ (Fetch All Projects) ---
    async function loadProjects() {
      const tableBody = document.getElementById('portfolioTableBody');
      const loadingState = document.getElementById('loadingState');
      const emptyState = document.getElementById('emptyState');
      
      loadingState.classList.remove('hidden');
      emptyState.classList.add('hidden');

      try {
        const response = await fetch('/portfolio');
        if (!response.ok) throw new Error('Failed to fetch portfolios');
        
        allProjects = await response.json();
        renderTable(allProjects);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    function renderTable(projects) {
      const tableBody = document.getElementById('portfolioTableBody');
      const emptyState = document.getElementById('emptyState');
      const projectCount = document.getElementById('projectCount');
      
      tableBody.innerHTML = '';
      projectCount.textContent = projects.length;

      if (projects.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      projects.forEach(p => {
        // Render tech tags
        const tags = p.teck_stack.split(',').map(tag => 
          `<span class="inline-block bg-slate-700/60 border border-slate-600 text-indigo-300 text-xs px-2 py-0.5 rounded-md mr-1 mb-1 font-mono">${tag.trim()}</span>`
        ).join('');

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-700/30 transition-colors";
        row.innerHTML = `
          <td class="px-6 py-4 font-mono font-medium text-slate-400">#${p.Project_id}</td>
          <td class="px-6 py-4 font-semibold text-slate-100">${p.Project_name}</td>
          <td class="px-6 py-4 max-w-xs">${tags}</td>
          <td class="px-6 py-4">
            <a href="${p.github_repo}" target="_blank" class="inline-flex items-center gap-1.5 text-indigo-400 hover:text-indigo-300 hover:underline">
              <i class="fa-brands fa-github"></i>
              <span class="truncate max-w-[180px]">${p.github_repo.replace('https://github.com/', '')}</span>
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button onclick="openEditModal(${p.Project_id}, '${escapeHtml(p.Project_name)}', '${escapeHtml(p.teck_stack)}', '${escapeHtml(p.github_repo)}')" class="p-2 text-slate-400 hover:text-amber-400 hover:bg-amber-400/10 rounded-lg transition" title="Edit">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteProject(${p.Project_id})" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 rounded-lg transition" title="Delete">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // --- 2. CREATE (Add Project) ---
    function openAddModal() {
      document.getElementById('addForm').reset();
      document.getElementById('addModal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    async function submitAddProject(e) {
      e.preventDefault();
      const payload = {
        Project_id: parseInt(document.getElementById('add_id').value),
        Project_name: document.getElementById('add_name').value.trim(),
        teck_stack: document.getElementById('add_stack').value.trim(),
        github_repo: document.getElementById('add_repo').value.trim()
      };

      try {
        const response = await fetch('/portfolio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not add portfolio');
        }

        showToast('Project added successfully!');
        closeAddModal();
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- 3. UPDATE (Edit Project) ---
    function openEditModal(id, name, stack, repo) {
      document.getElementById('edit_id').value = id;
      document.getElementById('edit_name').value = name;
      document.getElementById('edit_stack').value = stack;
      document.getElementById('edit_repo').value = repo;
      document.getElementById('editModal').classList.remove('hidden');
    }
    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function submitEditProject(e) {
      e.preventDefault();
      const id = document.getElementById('edit_id').value;
      const payload = {
        Project_name: document.getElementById('edit_name').value.trim(),
        teck_stack: document.getElementById('edit_stack').value.trim(),
        github_repo: document.getElementById('edit_repo').value.trim()
      };

      try {
        const response = await fetch(`/portfolio/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not update portfolio');
        }

        showToast('Project updated successfully!');
        closeEditModal();
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- 4. DELETE (Remove Project) ---
    async function deleteProject(id) {
      if (!confirm(`Are you sure you want to delete Project #${id}?`)) return;

      try {
        const response = await fetch(`/portfolio/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Could not delete portfolio');
        }

        showToast(`Project #${id} deleted.`);
        loadProjects();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // --- Helpers ---
    function handleSearch() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProjects.filter(p => 
        p.Project_name.toLowerCase().includes(term) || 
        p.teck_stack.toLowerCase().includes(term)
      );
      renderTable(filtered);
    }

    function escapeHtml(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', loadProjects);
  </script>
</body>
</html>
