<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PitStop AI</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="container">

        <!-- LOGIN -->

        <div class="card" id="loginCard">

            <h1>PitStop AI</h1>

            <p class="subtitle">
                AI-powered cold email automation
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch">
                Don't have an account?

                <button
                    type="button"
                    onclick="showRegister()"
                >
                    Register
                </button>
            </p>

        </div>


        <!-- REGISTER -->

        <div
            class="card hidden"
            id="registerCard"
        >

            <h1>PitStop AI</h1>

            <p class="subtitle">
                Create your account
            </p>

            <h2>Register</h2>

            <form id="registerForm">

                <input
                    type="text"
                    id="registerName"
                    placeholder="Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
                >
                <input
                    type="url"
                    id="registerLinkedin"
                    placeholder="LinkedIn URL"
                    required
                >

                <input
                    type="url"
                    id="registerGithub"
                    placeholder="GitHub URL"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="registerMessage"></p>

            <p class="switch">
                Already have an account?

                <button
                    type="button"
                    onclick="showLogin()"
                >
                    Login
                </button>
            </p>

        </div>


        <!-- USER AFTER LOGIN -->

        <div
            class="card hidden"
            id="userCard"
        >

            <h1>Welcome</h1>

            <p class="subtitle">
                You are successfully logged in.
            </p>

            <div id="userDetails">

                <p>
                    <strong>Name:</strong>
                    <span id="userName"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="userEmail"></span>
                </p>

            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
